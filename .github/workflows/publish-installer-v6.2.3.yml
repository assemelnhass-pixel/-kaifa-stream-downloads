name: Publish Windows installer v6.2.3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified installer package
        env:
          TRANSFER_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-832c-8208-9fa4-b5c737b171a7/raw?se=2026-10-01T07%3A35%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=9f0f956e-fddd-4d5d-8b7f-62617a598dda&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T06%3A28%3A55Z&ske=2026-10-02T06%3A28%3A55Z&sks=b&skv=2026-02-06&sig=xIM19%2BWNQAC%2BnS3hGkSRlmtfZYyhChlKzpLBBA1e9UE%3D"
        run: |
          curl -fL "$TRANSFER_URL" -o installer.zip
          mkdir -p out
          unzip -j installer.zip '*.exe' -d out
          installer=$(find out -maxdepth 1 -name '*.exe' -type f | head -n 1)
          test -n "$installer"
          echo "dcf4d30c51485def4a707c4b8e067371dd96e2e551a5dc175249233dbfeb29cc  $installer" | sha256sum -c -
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer=$(find out -maxdepth 1 -name '*.exe' -type f | head -n 1)
          gh release create v6.2.3 "$installer" --repo "$GITHUB_REPOSITORY" --title "KAIFA & SANA STREAM v6.2.3" --notes "Visible language ordering controls: Raise and Lower with automatic saving."
