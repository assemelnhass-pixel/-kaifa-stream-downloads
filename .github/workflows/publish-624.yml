name: Publish KAIFA SANA STREAM 6.2.4

on:
  push:
    paths:
      - .github/workflows/publish-624.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified installer
        env:
          ARTIFACT_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-4924-8208-8740-6b4ad044c378/raw?se=2026-10-01T07%3A59%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=b3197b02-4ae0-42ea-83b4-fdf7b27d21c1&skoid=f2622f62-3126-45cd-85e0-0bc840c3afdc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T03%3A26%3A32Z&ske=2026-10-02T03%3A26%3A32Z&sks=b&skv=2026-02-06&sig=ldZEyhJWrk%2Bj0gIgRTLaqOoWNUrpteKsJvAKqca6UXw%3D"
        run: |
          curl --fail --location "$ARTIFACT_URL" --output installer.zip
          unzip -o installer.zip -d installer
          test -f "installer/KAIFA-SANA-STREAM-Setup-6.2.4.exe"
          echo "ee8c94acd565e31689947cefc1cc3a9309dd38e1f4e22ba78d0789a7c2fd6e5d  installer/KAIFA-SANA-STREAM-Setup-6.2.4.exe" | sha256sum -c -
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v6.2.4 >/dev/null 2>&1; then
            gh release upload v6.2.4 "installer/KAIFA-SANA-STREAM-Setup-6.2.4.exe" --clobber
          else
            gh release create v6.2.4 "installer/KAIFA-SANA-STREAM-Setup-6.2.4.exe" --title "KAIFA & SANA STREAM v6.2.4" --notes "نسخة Windows المصححة: تحقق فعلي من إرسال Facebook وInstagram، وترميز H.264/AAC متوافق، وعدم إظهار حالة يعمل قبل وصول بيانات الفيديو."
          fi
